name: v_video_compressor_example
description: "Demonstrates how to use the v_video_compressor plugin."

publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 2.0.0
environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  v_video_compressor:
    # When depending on this package from a real application you should use:
    #   v_video_compressor: ^x.y.z
    # See https://dart.dev/tools/pub/deps#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../

  cupertino_icons: ^1.0.9
  file_picker: ^11.0.2
  gal: ^2.3.2
  image_picker: ^1.2.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

name: iOS compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.dependency-manager }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        dependency-manager:
          - swiftpm
          - cocoapods

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Configure iOS dependency manager
        shell: bash
        run: |
          if [[ "${{ matrix.dependency-manager }}" == "swiftpm" ]]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example for iOS
        working-directory: example
        run: flutter build ios --debug --no-codesign

      - name: Verify plugin integration
        working-directory: example
        shell: bash
        run: |
          if [[ "${{ matrix.dependency-manager }}" == "swiftpm" ]]; then
            grep -Fq '.package(name: "v_video_compressor"' \
              ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
          else
            grep -Fq -- '- v_video_compressor (' ios/Podfile.lock
          fi
